name: Patch social gallery

on:
  push:
    paths:
      - ".github/workflows/patch-social-gallery.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update social gallery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          head_needle = '  <script src="script.js" defer></script>\n</head>'
          head_replacement = '''  <script src="script.js" defer></script>
  <style>
    .social-grid.social-grid-six {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-flow: row;
    }

    .social-grid-six .social-tile-tall,
    .social-grid-six .social-tile-wide {
      grid-column: auto;
      grid-row: auto;
    }

    .social-grid-six .social-tile img,
    .social-grid-six .social-tile-tall img,
    .social-grid-six .social-tile-wide img {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .social-gallery-actions {
      margin-top: 2rem;
    }

    @media (max-width: 760px) {
      .social-grid.social-grid-six {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 460px) {
      .social-grid.social-grid-six {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>'''

          if head_needle not in text:
              raise SystemExit("Could not find the head insertion point")

          text = text.replace(head_needle, head_replacement, 1)
          text = text.replace('<div class="social-grid">', '<div class="social-grid social-grid-six">', 1)

          section_needle = '''        </div>
      </div>
    </section>

    <section class="section-shell about-section about-profile"'''
          section_replacement = '''        </div>
        <div class="project-actions social-gallery-actions reveal">
          <a class="button button-primary" href="https://www.behance.net/gallery/253635345/Instagram-Design-Collection" target="_blank" rel="noreferrer">View Full Collection on Behance ↗</a>
        </div>
      </div>
    </section>

    <section class="section-shell about-section about-profile"'''

          if section_needle not in text:
              raise SystemExit("Could not find the social gallery closing point")

          text = text.replace(section_needle, section_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/patch-social-gallery.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "portfolio-layout-bot"
          git config user.email "portfolio-layout-bot@users.noreply.github.com"
          git add index.html .github/workflows/patch-social-gallery.yml
          git commit -m "Arrange social gallery into a six-card grid"
          git push
